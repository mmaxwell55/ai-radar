name: weekly-radar
on:
  schedule:
    - cron: "0 5 * * 5"   # Fri 05:00 UTC = Thu 10pm Pacific (9pm in winter)
  workflow_dispatch: {}     # "Run workflow" button for manual runs
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python radar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "radar $(date -u +%F)"
          git push
